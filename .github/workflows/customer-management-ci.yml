---
name: Customer Management CI/CD

'on':
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'services/customer-management/**'
      - 'pkg/**'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/_service-ci-template.yml
    permissions:
      contents: write
      packages: write
    with:
      service_name: customer-management
      service_path: services/customer-management
      docker_context_path: .
      dockerfile_path: services/customer-management/Dockerfile
      image_name: customer-management
      release_title: Customer Management
    secrets: inherit
