---
name: Party Management CI/CD

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'services/party-management/**'
      - 'pkg/**'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/_service-ci-template.yml
    permissions:
      contents: write
      packages: write
    with:
      service_name: party-management
      service_path: services/party-management
      docker_context_path: .
      dockerfile_path: services/party-management/Dockerfile
      image_name: party-management
      release_title: Party Management
    secrets: inherit
