---
name: Demo UI CI/CD

'on':
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'services/demo-ui/**'
      - 'pkg/**'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate semantic-release config
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cat > .releaserc.json << 'EOF'
          {
            "branches": ["main"],
            "tagFormat": "demo-ui-v${version}",
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              "@semantic-release/github"
            ]
          }
          EOF

      - name: Semantic Release
        id: semantic
        if: github.ref == 'refs/heads/main'
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Dev Tag
        id: dev_tag
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          LATEST_TAG=$(git tag -l "demo-ui-v[0-9]*" | sort -V | tail -n1)
          [ -z "$LATEST_TAG" ] && LATEST_TAG="demo-ui-v0.0.0"
          BRANCH_CLEAN=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${LATEST_TAG}-${BRANCH_CLEAN}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            if [ "${{ steps.semantic.outputs.new_release_published }}" == "true" ]; then
              echo "next_tag=demo-ui-v${{ steps.semantic.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"
              echo "is_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "No releasable commits found. Skipping Docker build."
              echo "next_tag=" >> "$GITHUB_OUTPUT"
              echo "is_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "next_tag=${{ steps.dev_tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate Docker Tags
        id: meta
        if: steps.version.outputs.next_tag != ''
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${OWNER}/demo-ui"
          NEXT_TAG="${{ steps.version.outputs.next_tag }}"

          if [ "${{ steps.version.outputs.is_release }}" == "true" ]; then
            echo "DOCKER_TAGS_BFF=${IMAGE_BASE}:latest-bff,${IMAGE_BASE}:${NEXT_TAG}-bff" >> "$GITHUB_ENV"
            echo "DOCKER_TAGS_UI=${IMAGE_BASE}:latest-ui,${IMAGE_BASE}:${NEXT_TAG}-ui" >> "$GITHUB_ENV"
          else
            echo "DOCKER_TAGS_BFF=${IMAGE_BASE}:${NEXT_TAG}-bff" >> "$GITHUB_ENV"
            echo "DOCKER_TAGS_UI=${IMAGE_BASE}:${NEXT_TAG}-ui" >> "$GITHUB_ENV"
          fi

      - name: Build and push BFF image
        if: steps.version.outputs.next_tag != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/demo-ui/bff/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.actor != 'dependabot[bot]' }}
          tags: ${{ env.DOCKER_TAGS_BFF }}

      - name: Build and push UI image
        if: steps.version.outputs.next_tag != ''
        uses: docker/build-push-action@v5
        with:
          context: ./services/demo-ui/ui
          file: ./services/demo-ui/ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.actor != 'dependabot[bot]' }}
          tags: ${{ env.DOCKER_TAGS_UI }}
