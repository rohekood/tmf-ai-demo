---
name: Service CI Template

'on':
  workflow_call:
    inputs:
      service_name:
        description: Service folder name under services/
        required: true
        type: string
      service_path:
        description: Relative path to service directory
        required: true
        type: string
      image_name:
        description: GHCR image name
        required: true
        type: string
      release_title:
        description: Human-readable release title prefix (kept for backwards compatibility, unused)
        required: false
        type: string
        default: ''
      dockerfile_path:
        description: Relative path to Dockerfile
        required: false
        type: string
        default: ''
      docker_context_path:
        description: Relative path to Docker build context
        required: false
        type: string
        default: ''
      platforms:
        description: Docker build platforms
        required: false
        type: string
        default: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      next_tag: ${{ steps.version.outputs.next_tag }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate package.json for semantic-release-monorepo
        if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          cat > "${{ inputs.service_path }}/package.json" << EOF
          {"name":"${{ inputs.service_name }}","version":"0.0.0","private":true}
          EOF

      - name: Generate semantic-release config
        if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          SERVICE_NAME="${{ inputs.service_name }}"
          SERVICE_PATH="${{ inputs.service_path }}"
          cat > "${SERVICE_PATH}/.releaserc.json" << EOF
          {
            "branches": ["main"],
            "tagFormat": "${SERVICE_NAME}-v\${version}",
            "extends": "semantic-release-monorepo",
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              "@semantic-release/github"
            ]
          }
          EOF

      - name: Check if already tagged at this commit
        id: tag_check
        if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          SERVICE_NAME="${{ inputs.service_name }}"
          EXISTING_TAG=$(git tag -l "${SERVICE_NAME}-v*" --sort=-version:refname | head -1)
          if [ -n "$EXISTING_TAG" ]; then
            TAGGED_COMMIT=$(git rev-list -n 1 "$EXISTING_TAG")
            if [ "$TAGGED_COMMIT" == "${{ github.sha }}" ]; then
              echo "already_released=true" >> "$GITHUB_OUTPUT"
              echo "version=${EXISTING_TAG#${SERVICE_NAME}-v}" >> "$GITHUB_OUTPUT"
              echo "Commit already tagged as ${EXISTING_TAG}, skipping semantic-release."
            else
              echo "already_released=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Semantic Release
        id: semantic
        if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' && steps.tag_check.outputs.already_released != 'true'
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24
          extra_plugins: |
            semantic-release-monorepo
          working_directory: ${{ inputs.service_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force patch release
        id: force_release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          SERVICE_PREFIX="${{ inputs.service_name }}-v"
          HEAD_TAG=$(git tag -l "${SERVICE_PREFIX}[0-9]*" --points-at HEAD | sort -V | tail -n1)
          if [ -n "$HEAD_TAG" ]; then
            echo "HEAD already tagged as ${HEAD_TAG}, reusing it."
            echo "tag=${HEAD_TAG}" >> "$GITHUB_OUTPUT"
          else
            LATEST_TAG=$(git tag -l "${SERVICE_PREFIX}[0-9]*" | sort -V | tail -n1)
            if [ -z "$LATEST_TAG" ]; then
              NEW_TAG="${SERVICE_PREFIX}0.0.1"
            else
              VERSION="${LATEST_TAG#${SERVICE_PREFIX}}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              PATCH=$((PATCH + 1))
              NEW_TAG="${SERVICE_PREFIX}${MAJOR}.${MINOR}.${PATCH}"
            fi
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
            echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute Dev Tag
        id: dev_tag
        if: github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          SERVICE_PREFIX="${{ inputs.service_name }}-v"
          LATEST_TAG=$(git tag -l "${SERVICE_PREFIX}[0-9]*" | sort -V | tail -n1)
          [ -z "$LATEST_TAG" ] && LATEST_TAG="${SERVICE_PREFIX}0.0.0"
          BRANCH_CLEAN=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${LATEST_TAG}-${BRANCH_CLEAN}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "next_tag=${{ steps.force_release.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            if [ "${{ steps.tag_check.outputs.already_released }}" == "true" ]; then
              echo "next_tag=${{ inputs.service_name }}-v${{ steps.tag_check.outputs.version }}" >> "$GITHUB_OUTPUT"
              echo "is_release=true" >> "$GITHUB_OUTPUT"
            elif [ "${{ steps.semantic.outputs.new_release_published }}" == "true" ]; then
              echo "next_tag=${{ inputs.service_name }}-v${{ steps.semantic.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"
              echo "is_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "No releasable commits found. Skipping Docker build."
              echo "next_tag=" >> "$GITHUB_OUTPUT"
              echo "is_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "next_tag=${{ steps.dev_tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate Docker Tags
        id: meta
        if: steps.version.outputs.next_tag != ''
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SERVICE="${{ inputs.image_name }}"
          DOCKER_IMAGE_BASE="ghcr.io/${OWNER}/${SERVICE}"
          NEXT_TAG="${{ steps.version.outputs.next_tag }}"

          if [ "${{ steps.version.outputs.is_release }}" == "true" ]; then
            DOCKER_TAGS="${DOCKER_IMAGE_BASE}:latest,${DOCKER_IMAGE_BASE}:${NEXT_TAG}"
          else
            DOCKER_TAGS="${DOCKER_IMAGE_BASE}:${NEXT_TAG}"
          fi

          echo "DOCKER_TAGS=${DOCKER_TAGS}" >> "$GITHUB_ENV"

      - name: Build and push
        if: steps.version.outputs.next_tag != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.docker_context_path != '' && format('./{0}', inputs.docker_context_path) || format('./{0}', inputs.service_path) }}
          file: ${{ inputs.dockerfile_path != '' && format('./{0}', inputs.dockerfile_path) || format('./{0}/Dockerfile', inputs.service_path) }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.actor != 'dependabot[bot]' }}
          tags: ${{ env.DOCKER_TAGS }}
