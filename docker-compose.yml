services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: tmf-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: tmf-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tmf_party_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-ui:
    build:
      context: ./services/demo-ui/ui
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
        VITE_API_URL: ${VITE_API_URL}
    environment:
      AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
      AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
      API_URL: ${VITE_API_URL}
    container_name: tmf-demo-ui
    ports:
      - "80:80"
    depends_on:
      - bff

  bff:
    build:
      context: .
      dockerfile: services/demo-ui/bff/Dockerfile
    container_name: tmf-bff
    ports:
      - "8080:8080"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
    depends_on:
      rabbitmq:
        condition: service_healthy

  customer-management:
    build:
      context: .
      dockerfile: services/customer-management/Dockerfile
    container_name: tmf-customer-management
    ports:
      - "8081:8081"
    environment:
      - POSTGRES_URL=postgres://postgres:password@postgres:5432/tmf_customer_db?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  party-management:
    build:
      context: .
      dockerfile: services/party-management/Dockerfile
    container_name: tmf-party-management
    ports:
      - "8082:8080"
    environment:
      - POSTGRES_URL=postgres://postgres:password@postgres:5432/tmf_party_db?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  product-catalog-management:
    build:
      context: .
      dockerfile: services/product-catalog-management/Dockerfile
    container_name: tmf-product-catalog-management
    environment:
      - POSTGRES_URL=postgres://postgres:password@postgres:5432/tmf_catalog_db?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  pocv:
    build:
      context: .
      dockerfile: services/pocv/Dockerfile
    container_name: tmf-pocv
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/tmf_pocv_db?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  qualification:
    build:
      context: .
      dockerfile: services/qualification/Dockerfile
    container_name: tmf-qualification
    environment:
      - POSTGRES_URL=postgres://postgres:password@postgres:5432/tmf_qualification_db?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Stand-in GIS provider for qualification scatter-gather (query.gis.geography.check).
  mock-gis:
    build:
      context: .
      dockerfile: services/qualification/Dockerfile
      args:
        CMD_PATH: ./cmd/mock-gis/main.go
    container_name: tmf-mock-gis
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Stand-in Inventory provider: qualification capacity query + POCV saga reservation.
  mock-inventory:
    build:
      context: .
      dockerfile: services/qualification/Dockerfile
      args:
        CMD_PATH: ./cmd/mock-inventory/main.go
    container_name: tmf-mock-inventory
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  shopping-cart:
    build:
      context: .
      dockerfile: services/shopping-cart/Dockerfile
    container_name: tmf-shopping-cart
    environment:
      - DB_URL=postgres://postgres:password@postgres:5432/tmf_cart_db?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8-alpine
    container_name: tmf-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  rabbitmq_data:
  postgres_data:
