services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: tmf-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: tmf-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tmf_party_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-ui:
    build:
      context: ./services/demo-ui/ui
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-rohekood.eu.auth0.com}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-fZ3FUKv67tYfK5BT9Pd85LtoMy1nCe2e}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-http://localhost/api}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: tmf-demo-ui
    ports:
      - "80:80"
    depends_on:
      - bff

  bff:
    build:
      context: ./services/demo-ui/bff
      dockerfile: Dockerfile
    container_name: tmf-bff
    ports:
      - "8080:8080"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - AUTH0_DOMAIN=${AUTH0_DOMAIN:-rohekood.eu.auth0.com}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE:-http://localhost/api}
    depends_on:
      rabbitmq:
        condition: service_healthy

  customer-management:
    build:
      context: ./services/customer-management
      dockerfile: Dockerfile
    container_name: tmf-customer-management
    ports:
      - "8081:8081"
    environment:
      - DB_URL=postgres://postgres:password@postgres:5432/tmf_customer_db?sslmode=disable
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  party-management:
    build:
      context: ./services/party-management
      dockerfile: Dockerfile
    container_name: tmf-party-management
    ports:
      - "8082:8080"
    environment:
      - POSTGRES_URL=postgres://postgres:password@postgres:5432/tmf_party_db?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
  postgres_data:
