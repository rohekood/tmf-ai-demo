version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: tmf-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:15-alpine
    container_name: tmf-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tmf_party_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  demo-ui:
    build:
      context: ./services/demo-ui/ui
      dockerfile: Dockerfile
    container_name: tmf-demo-ui
    ports:
      - "80:80"
    depends_on:
      - bff

  bff:
    build:
      context: ./services/demo-ui/bff
      dockerfile: Dockerfile
    container_name: tmf-bff
    ports:
      - "8080:8080"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq

volumes:
  rabbitmq_data:
  postgres_data:
