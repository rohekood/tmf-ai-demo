#   env:
#     secretName: tmf-secrets
#     rabbitmq:
#       value: "amqp://user:pass@rabbitmq:5672/"
#
# partyManagement:
#   enabled: true
#   env:
#     postgres:
#       value: "postgres://user:pass@postgres:5432/tmf_party_db?sslmode=disable"
#     rabbitmq:
#       value: "amqp://user:pass@rabbitmq:5672/"
