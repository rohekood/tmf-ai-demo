# Enable/disable subcharts
bff:
  enabled: true
customer-management:
  enabled: true
demo-ui:
  enabled: true
party-management:
  enabled: true
pocv:
  enabled: true
product-catalog-management:
  enabled: true
qualification:
  enabled: true
