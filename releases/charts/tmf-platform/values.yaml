# Enable/disable subcharts
bff:
  enabled: true
customerManagement:
  enabled: true
demoUi:
  enabled: true
partyManagement:
  enabled: true
pocv:
  enabled: true
productCatalogManagement:
  enabled: true
qualification:
  enabled: true
shoppingCart:
