# Enable/disable subcharts
bff:
  enabled: true
customer-management:
  enabled: true
demo-ui:
  enabled: true
party-management:
  enabled: true
pocv:
  enabled: true
product-catalog-management:
  enabled: true
qualification:
  enabled: true
shopping-cart:
  enabled: true

emissary:
  enabled: false
  # Optional hostname (DNS name or IP) to match. Leave empty to match any host.
  hostname: ""
  # Optional ambassador_id if your Emissary deployment filters by ID.
  ambassadorId: ""
  # Create a Host resource for Host-level policy (requires hostname).
  createHost: false
  host:
    tlsSecretName: ""
  mapping:
    uiPrefix: "/"
    apiPrefix: "/api/"

# Pass-through values to each child chart below these keys.
# Example:
# bff:
#   enabled: true
#   image:
#     tag: "main-123"
#   env:
#     secretName: tmf-secrets
#     rabbitmq:
#       secretName: ""
#       secretKey: RABBITMQ_URL
#
# party-management:
#   enabled: true
#   env:
#     postgres:
#       secretName: ""
#       secretKey: PARTY_DB_URL
#     rabbitmq:
#       secretName: ""
#       secretKey: RABBITMQ_URL
#
# qualification:
#   enabled: true
#   env:
#     redis:
#       addr: "valkey-master.tmf.svc.cluster.local:6379"
#       secretName: ""
#       addrSecretKey: ""
#       passwordSecretKey: REDIS_PASSWORD
