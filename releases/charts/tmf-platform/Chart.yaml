apiVersion: v2
name: tmf-platform
description: Umbrella chart for deploying all TMF AI Demo application services
type: application
version: 0.1.0
appVersion: "latest"

dependencies:
  - name: bff
    version: 0.1.0
    repository: file://../bff
    alias: bff
    condition: bff.enabled
  - name: customer-management
    version: 0.1.0
    repository: file://../customer-management
    alias: customerManagement
    condition: customerManagement.enabled
  - name: demo-ui
    version: 0.1.0
    repository: file://../demo-ui
    alias: demoUi
    condition: demoUi.enabled
  - name: party-management
    version: 0.1.0
    repository: file://../party-management
    alias: partyManagement
    condition: partyManagement.enabled
  - name: pocv
    version: 0.1.0
    repository: file://../pocv
    alias: pocv
    condition: pocv.enabled
  - name: product-catalog-management
    version: 0.1.0
    repository: file://../product-catalog-management
    alias: productCatalogManagement
    condition: productCatalogManagement.enabled
  - name: qualification
    version: 0.1.0
    repository: file://../qualification
    alias: qualification
    condition: qualification.enabled
  - name: shopping-cart
    version: 0.1.0
    repository: file://../shopping-cart
    alias: shoppingCart
    condition: shoppingCart.enabled
