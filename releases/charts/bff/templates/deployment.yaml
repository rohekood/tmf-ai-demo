apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bff.fullname" . }}
  labels:
    {{- include "bff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bff.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bff.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.env.secretName .Values.env.rabbitmq.secretName }}
                  key: {{ .Values.env.rabbitmq.secretKey }}
            {{- if or .Values.env.auth0.secretName .Values.env.secretName }}
            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.env.secretName .Values.env.auth0.secretName }}
                  key: {{ .Values.env.auth0.domainKey | quote }}
            - name: AUTH0_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.env.secretName .Values.env.auth0.secretName }}
                  key: {{ .Values.env.auth0.audienceKey | quote }}
            {{- else }}
            - name: AUTH0_DOMAIN
              value: {{ .Values.env.auth0Domain | quote }}
            - name: AUTH0_AUDIENCE
              value: {{ .Values.env.auth0Audience | quote }}
            {{- end }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            {{- with .Values.env.extra }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
