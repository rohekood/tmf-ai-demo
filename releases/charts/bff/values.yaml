replicaCount: 1

image:
  repository: ghcr.io/rohekood/demo-ui
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8080

env:
  secretName: tmf-secrets
  rabbitmq:
    secretName: ""
    secretKey: RABBITMQ_URL
  auth0:
    secretName: ""
    domainKey: AUTH0_DOMAIN
    audienceKey: AUTH0_AUDIENCE
  extra: []
  # Auth0 values are non-secret; set them here or override in HelmRelease
  auth0Domain: ""
  auth0Audience: ""

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
