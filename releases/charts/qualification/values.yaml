replicaCount: 1

image:
  repository: ghcr.io/rohekood/qualification
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

# qualification is a pure consumer service (no HTTP endpoint)
service:
  enabled: false

env:
  secretName: tmf-secrets
  rabbitmq:
    secretName: ""
    secretKey: RABBITMQ_URL
  postgres:
    secretName: ""
    secretKey: QUALIFICATION_DB_URL
  redis:
    addr: "redis-master.tmf.svc.cluster.local:6379"
    secretName: ""
    addrSecretKey: ""
    passwordSecretKey: ""
  extra: []
  # Backward compatibility for existing overrides.
  redisAddr: "redis-master.tmf.svc.cluster.local:6379"

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
