replicaCount: 1

image:
  repository: ghcr.io/rohekood/customer-management
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8081

env:
  # Passed in from a Secret; set secretName to the name of your tmf-secrets Secret
  secretName: tmf-secrets
  rabbitmq:
    secretName: ""
    secretKey: RABBITMQ_URL
  postgres:
    secretName: ""
    secretKey: CUSTOMER_DB_URL
  # Non-secret env overrides (optional)
  extra: []
  # - name: HTTP_PORT
  #   value: "8081"

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
