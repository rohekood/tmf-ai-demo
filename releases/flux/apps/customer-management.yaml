---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: customer-management
  namespace: tmf
spec:
  interval: 5m
  dependsOn:
    - name: postgres
    - name: rabbitmq
  chart:
    spec:
      chart: ./releases/charts/customer-management
      sourceRef:
        kind: GitRepository
        name: tmf-ai-demo
        namespace: flux-system
  values:
    # Pin image.tag to a specific semver or git SHA before deploying to production.
    # image:
    #   tag: "1.0.0"
    env:
      secretName: tmf-secrets
