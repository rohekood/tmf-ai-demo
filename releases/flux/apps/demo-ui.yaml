---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo-ui
  namespace: tmf
spec:
  interval: 5m
  dependsOn:
    - name: bff
  chart:
    spec:
      chart: ./releases/charts/demo-ui
      sourceRef:
        kind: GitRepository
        name: tmf-ai-demo
        namespace: flux-system
  values:
    image:
      tag: "latest"
    service:
      type: LoadBalancer
      port: 80
