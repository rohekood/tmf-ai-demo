---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo-ui
  namespace: tmf
spec:
  interval: 5m
  dependsOn:
    - name: bff
  chart:
    spec:
      chart: ./releases/charts/demo-ui
      sourceRef:
        kind: GitRepository
        name: tmf-ai-demo
        namespace: flux-system
  values:
    # Pin image.tag to a specific semver or git SHA before deploying to production.
    # image:
    #   tag: "1.0.0"
    service:
      type: LoadBalancer
      port: 80
