---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qualification
  namespace: tmf
spec:
  interval: 5m
  dependsOn:
    - name: postgres
    - name: rabbitmq
  chart:
    spec:
      chart: ./releases/charts/qualification
      sourceRef:
        kind: GitRepository
        name: tmf-ai-demo
        namespace: flux-system
  values:
    env:
      secretName: tmf-secrets
      redisAddr: "redis-master.tmf.svc.cluster.local:6379"
