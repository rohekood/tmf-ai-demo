---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: party-management
  namespace: tmf
spec:
  interval: 5m
  dependsOn:
    - name: postgres
    - name: rabbitmq
  chart:
    spec:
      chart: ./releases/charts/party-management
      sourceRef:
        kind: GitRepository
        name: tmf-ai-demo
        namespace: flux-system
  values:
    image:
      tag: "latest"
    env:
      secretName: tmf-secrets
