---
# Example Secret — fill in real values and apply before deploying with Flux.
# DO NOT commit secrets with real credentials. Use Sealed Secrets, SOPS, or
# an external secrets operator to manage this in GitOps.
#
# Apply: kubectl apply -f releases/flux/tmf-secrets.example.yaml
# (after replacing all placeholder values)
apiVersion: v1
kind: Secret
metadata:
  name: tmf-secrets
  namespace: tmf
type: Opaque
stringData:
  # PostgreSQL connection strings
  CUSTOMER_DB_URL: "postgres://postgres:CHANGE_ME@postgres-postgresql.tmf.svc.cluster.local:5432/tmf_customer_db?sslmode=disable"
  PARTY_DB_URL: "postgres://postgres:CHANGE_ME@postgres-postgresql.tmf.svc.cluster.local:5432/postgres?sslmode=disable"
  CATALOG_DB_URL: "postgres://postgres:CHANGE_ME@postgres-postgresql.tmf.svc.cluster.local:5432/tmf_catalog_db?sslmode=disable"
  CART_DB_URL: "postgres://postgres:CHANGE_ME@postgres-postgresql.tmf.svc.cluster.local:5432/tmf_cart_db?sslmode=disable"
  QUALIFICATION_DB_URL: "postgres://postgres:CHANGE_ME@postgres-postgresql.tmf.svc.cluster.local:5432/tmf_qualification_db?sslmode=disable"
  POCV_DB_URL: "postgres://postgres:CHANGE_ME@postgres-postgresql.tmf.svc.cluster.local:5432/tmf_pocv_db?sslmode=disable"
  POSTGRES_PASSWORD: "CHANGE_ME"

  # RabbitMQ
  RABBITMQ_URL: "amqp://guest:CHANGE_ME@rabbitmq.tmf.svc.cluster.local:5672/"
  RABBITMQ_PASSWORD: "CHANGE_ME"

  # Redis (optional — qualification service gracefully degrades without it)
  REDIS_PASSWORD: ""
