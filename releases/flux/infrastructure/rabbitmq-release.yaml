---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rabbitmq
  namespace: tmf
spec:
  interval: 5m
  chart:
    spec:
      chart: rabbitmq
      version: ">=12.0.0 <13.0.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    auth:
      username: tmf
      existingPasswordSecret: tmf-secrets
      existingSecretPasswordKey: RABBITMQ_PASSWORD
    persistence:
      enabled: true
      size: 4Gi
    service:
      type: ClusterIP
